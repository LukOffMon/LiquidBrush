# Comprobaciones en cada push y pull request: sintaxis, ESLint, datos y tests en el navegador
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Sintaxis y datos (listas, catálogo, CSP, versiones)
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Navegador para los tests
        # Si los repositorios de Ubuntu no responden (pasa a veces en los servidores de GitHub), se instala
        # solo Chromium: las bibliotecas que necesita ya vienen en la imagen; lo que falla son fuentes extra
        # (con un tope de 3 minutos para no gastar el tiempo de los tests esperando a Ubuntu)
        run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Tests de extremo a extremo (móvil y escritorio)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
