# Worker de cuentas de Liquid Bullet · cuenta Liquidbulletofficial@gmail.com's Account
# Secretos (wrangler secret put …, nunca en el repositorio): SMTP_PASS · PIMIENTA · FIRMA · TURNSTILE_SECRETO · ADMIN
name = "liquid-cuentas"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "b32f5b627debd3ffa467787fc17cda57"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "liquid-cuentas-db"
database_id = "26619036-4e5b-4847-af0b-45c8b163af20"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DATOS"
bucket_name = "liquid-cuentas"

# Freno por IP y ruta (20 peticiones por minuto)
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 4 * * *"]   # limpieza diaria, 04:17 UTC

[vars]
ORIGENES = "https://lukoffmon.github.io"
SMTP_USER = "liquidbulletofficial@gmail.com"
TURNSTILE_SITIO = "0x4AAAAAAF1SaKaBNeMZR5B-"

[observability]
enabled = true
