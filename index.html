<!DOCTYPE html>
<html lang="es" data-theme="chrome">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LiquidBrush — música que se derrite: tu reproductor web personal, surrealista y cromado.">
  <meta name="theme-color" content="#100d1c">
  <title>LiquidBrush</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.45' stop-color='%236b7385'/%3E%3Cstop offset='.55' stop-color='%233a3f4f'/%3E%3Cstop offset='1' stop-color='%23e9eef5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath fill='%23100d1c' transform='translate(2.4 2.4) scale(.8)' d='M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 0 0 0-1.41z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&family=Rubik+Wet+Paint&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Aplica el tema guardado antes de pintar la página para evitar parpadeos */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('liquidbrush:theme'));
        if (['chrome', 'dark', 'cyberpunk', 'minimal', 'synthwave'].indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* sin acceso a localStorage */ }
    })();
  </script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Degradados compartidos por la escena surrealista (no usar display:none: rompe los degradados) -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="chrome-v" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".22" stop-color="#c5cddb"/>
        <stop offset=".46" stop-color="#4e5566"/>
        <stop offset=".53" stop-color="#262a35"/>
        <stop offset=".62" stop-color="#d9e0ea"/>
        <stop offset=".82" stop-color="#8790a3"/>
        <stop offset="1" stop-color="#f4f7fb"/>
      </linearGradient>
      <linearGradient id="chrome-h" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5a6273"/>
        <stop offset=".3" stop-color="#ffffff"/>
        <stop offset=".55" stop-color="#7c8597"/>
        <stop offset=".75" stop-color="#e6ebf3"/>
        <stop offset="1" stop-color="#3f4554"/>
      </linearGradient>
      <radialGradient id="melt-face" cx=".4" cy=".3" r=".85">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".55" stop-color="#e4e8f0"/>
        <stop offset="1" stop-color="#9aa2b4"/>
      </radialGradient>
      <radialGradient id="iris-grad">
        <stop offset="0" stop-color="#1b1030"/>
        <stop offset=".35" stop-color="#6a5cff"/>
        <stop offset=".6" stop-color="#4fd6ff"/>
        <stop offset=".85" stop-color="#ff8fd8"/>
        <stop offset="1" stop-color="#2b1d4a"/>
      </radialGradient>
      <clipPath id="eye-clip"><path d="M4 35 Q60 -14 116 35 Q60 84 4 35 Z"/></clipPath>
    </defs>
  </svg>

  <!-- Escena surrealista (solo visible con el tema "Cromo Surreal") -->
  <div class="surreal" aria-hidden="true">
    <div class="chrome-sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="floor"></div>

    <svg class="ladder" viewBox="0 0 60 300" preserveAspectRatio="xMidYMax meet">
      <rect x="4" y="0" width="6" height="300" rx="3" fill="url(#chrome-h)"/>
      <rect x="50" y="0" width="6" height="300" rx="3" fill="url(#chrome-h)"/>
      <rect x="6" y="28" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="68" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="108" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="148" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="188" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="228" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
      <rect x="6" y="268" width="48" height="5" rx="2.5" fill="url(#chrome-v)"/>
    </svg>

    <svg class="melting-clock" viewBox="0 0 240 220">
      <rect x="8" y="116" width="226" height="12" rx="6" fill="url(#chrome-v)"/>
      <path d="M30 70C30 30 80 15 130 18C185 21 215 45 212 85C210 110 196 118 180 122C168 126 164 140 166 165C168 190 160 208 148 208C135 208 131 192 134 168C137 140 128 128 112 130C98 132 94 140 92 152C90 162 84 168 78 166C70 164 70 152 70 142C70 130 60 124 46 120C34 116 30 100 30 70Z" fill="url(#melt-face)" stroke="url(#chrome-v)" stroke-width="6" stroke-linejoin="round"/>
      <g stroke="#3a3f4f" stroke-width="3" stroke-linecap="round">
        <line x1="120" y1="27" x2="120" y2="35"/>
        <line x1="180" y1="72" x2="172" y2="72"/>
        <line x1="60" y1="74" x2="68" y2="74"/>
      </g>
      <ellipse cx="150" cy="172" rx="2.5" ry="15" fill="#3a3f4f"/>
      <g class="clock-hand clock-hour"><line x1="120" y1="72" x2="120" y2="50" stroke="#2a2e3a" stroke-width="5" stroke-linecap="round"/></g>
      <g class="clock-hand clock-minute"><line x1="120" y1="72" x2="152" y2="58" stroke="#2a2e3a" stroke-width="3" stroke-linecap="round"/></g>
      <circle cx="120" cy="72" r="5" fill="url(#chrome-v)"/>
    </svg>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <div class="eye eye-1">
      <svg viewBox="0 0 120 70">
        <g class="eye-blink">
          <path d="M4 35 Q60 -14 116 35 Q60 84 4 35 Z" fill="url(#melt-face)"/>
          <g clip-path="url(#eye-clip)">
            <g class="eye-wander">
              <g class="eye-iris">
                <circle cx="60" cy="35" r="20" fill="url(#iris-grad)"/>
                <circle cx="60" cy="35" r="8" fill="#07060c"/>
                <circle cx="53" cy="28" r="4" fill="#ffffff" opacity=".9"/>
              </g>
            </g>
          </g>
          <path d="M4 35 Q60 -14 116 35 Q60 84 4 35 Z" fill="none" stroke="url(#chrome-v)" stroke-width="4"/>
        </g>
      </svg>
    </div>
    <div class="eye eye-2">
      <svg viewBox="0 0 120 70">
        <g class="eye-blink">
          <path d="M4 35 Q60 -14 116 35 Q60 84 4 35 Z" fill="url(#melt-face)"/>
          <g clip-path="url(#eye-clip)">
            <g class="eye-wander">
              <g class="eye-iris">
                <circle cx="60" cy="35" r="20" fill="url(#iris-grad)"/>
                <circle cx="60" cy="35" r="8" fill="#07060c"/>
                <circle cx="53" cy="28" r="4" fill="#ffffff" opacity=".9"/>
              </g>
            </g>
          </g>
          <path d="M4 35 Q60 -14 116 35 Q60 84 4 35 Z" fill="none" stroke="url(#chrome-v)" stroke-width="4"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Iconos SVG reutilizables -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-brush" viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 0 0 0-1.41z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.79-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="i-volume-high" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="i-volume-low" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></symbol>
    <symbol id="i-volume-mute" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></symbol>
  </svg>

  <div class="app">
    <!-- Barra superior -->
    <header class="topbar">
      <a class="brand" href="./" aria-label="LiquidBrush, inicio">
        <span class="brand-logo"><svg class="icon" aria-hidden="true"><use href="#i-brush"></use></svg></span>
        <span class="brand-name">Liquid<span>Brush</span></span>
      </a>
      <label class="theme-picker">
        <svg class="icon" aria-hidden="true"><use href="#i-palette"></use></svg>
        <span class="sr-only">Tema de color</span>
        <select id="themeSelect">
          <option value="chrome">Cromo Surreal</option>
          <option value="dark">Dark Mode Standard</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="minimal">Minimalista</option>
          <option value="synthwave">Retro Synthwave</option>
        </select>
      </label>
    </header>

    <main class="layout">
      <!-- Canción actual -->
      <section class="now-playing" aria-labelledby="npTitle">
        <div class="cover-wrap">
          <img id="cover" class="cover" alt="Carátula" width="300" height="300">
        </div>

        <div class="np-info">
          <div class="np-text">
            <p id="npContext" class="np-eyebrow">Cargando biblioteca…</p>
            <h1 id="npTitle" class="np-title">LiquidBrush</h1>
            <p id="npArtist" class="np-artist">Música que se derrite en tus oídos.</p>
            <p id="npAlbum" class="np-album"></p>
          </div>
          <button id="npFavBtn" class="icon-btn fav-btn fav-btn-lg" type="button" aria-pressed="false" aria-label="Añadir a favoritos" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-heart"></use></svg>
          </button>
        </div>

        <canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>

        <details id="lyricsPanel" class="lyrics" open>
          <summary>Letra <span id="lyricsBadge" class="badge" hidden>Sincronizada</span></summary>
          <div id="lyricsBody" class="lyrics-body">
            <p class="lyrics-empty">Elige una canción para ver su letra.</p>
          </div>
        </details>
      </section>

      <!-- Biblioteca -->
      <section class="library" aria-label="Biblioteca">
        <div class="library-head">
          <div class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <label for="searchInput" class="sr-only">Buscar canciones</label>
            <input id="searchInput" type="search" placeholder="Buscar por título, artista o álbum" autocomplete="off" spellcheck="false">
          </div>
          <div class="tabs" role="tablist" aria-label="Vista de la biblioteca">
            <button class="tab is-active" type="button" role="tab" data-view="all" aria-selected="true">Todas</button>
            <button class="tab" type="button" role="tab" data-view="favorites" aria-selected="false">
              Favoritas <span id="favCount" class="count">0</span>
            </button>
          </div>
        </div>

        <p id="listInfo" class="list-info" aria-live="polite"></p>
        <ul id="trackList" class="track-list"></ul>
      </section>
    </main>

    <!-- Reproductor -->
    <footer class="player" aria-label="Controles del reproductor">
      <div class="player-track">
        <img id="miniCover" class="mini-cover" alt="" width="52" height="52">
        <div class="mini-text">
          <p id="miniTitle" class="mini-title">Sin reproducción</p>
          <p id="miniArtist" class="mini-artist">—</p>
        </div>
      </div>

      <div class="player-center">
        <div class="controls">
          <button id="shuffleBtn" class="icon-btn mode-btn" type="button" aria-pressed="false" aria-label="Aleatorio" title="Aleatorio (S)">
            <svg class="icon" aria-hidden="true"><use href="#i-shuffle"></use></svg>
          </button>
          <button id="prevBtn" class="icon-btn" type="button" aria-label="Canción anterior" title="Anterior (P)">
            <svg class="icon" aria-hidden="true"><use href="#i-prev"></use></svg>
          </button>
          <button id="playBtn" class="icon-btn play-btn" type="button" aria-label="Reproducir" title="Reproducir / Pausa (Espacio)">
            <svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>
          </button>
          <button id="nextBtn" class="icon-btn" type="button" aria-label="Canción siguiente" title="Siguiente (N)">
            <svg class="icon" aria-hidden="true"><use href="#i-next"></use></svg>
          </button>
          <button id="repeatBtn" class="icon-btn mode-btn" type="button" aria-label="Repetir: desactivado" title="Repetir: desactivado (R)">
            <svg class="icon" aria-hidden="true"><use href="#i-repeat"></use></svg>
          </button>
        </div>

        <div class="progress-row">
          <span id="currentTime" class="time">0:00</span>
          <input id="progress" class="range progress" type="range" min="0" max="100" step="any" value="0" aria-label="Progreso de la canción">
          <span id="totalTime" class="time">0:00</span>
        </div>
      </div>

      <div class="player-volume">
        <button id="muteBtn" class="icon-btn" type="button" aria-label="Silenciar" title="Silenciar (M)">
          <svg class="icon" aria-hidden="true"><use href="#i-volume-high"></use></svg>
        </button>
        <input id="volume" class="range volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js" defer></script>
</body>
</html>
