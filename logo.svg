<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="lb-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a6e"/>
      <stop offset=".55" stop-color="#1a1233"/>
      <stop offset="1" stop-color="#0b0814"/>
    </radialGradient>
    <linearGradient id="lb-chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4f66"/>
      <stop offset=".14" stop-color="#c9d2e6"/>
      <stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#8f98b3"/>
      <stop offset=".58" stop-color="#2c2f45"/>
      <stop offset=".76" stop-color="#b9c3dc"/>
      <stop offset=".9" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#5a6079"/>
    </linearGradient>
    <linearGradient id="lb-tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef9ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#7ef9ff" stop-opacity="0"/>
      <stop offset=".72" stop-color="#ff7ad9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lb-drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#aab4cf"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ef9ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7ef9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lb-clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#lb-clip)">
    <rect width="512" height="512" fill="url(#lb-bg)"/>
    <ellipse cx="256" cy="250" rx="190" ry="210" fill="url(#lb-glow)"/>
    <!-- charco de metal -->
    <ellipse cx="256" cy="442" rx="150" ry="20" fill="#7a5cff" opacity=".35"/>
    <ellipse cx="258" cy="438" rx="104" ry="13" fill="url(#lb-drop)" opacity=".55"/>
    <ellipse cx="236" cy="434" rx="44" ry="4" fill="#ffffff" opacity=".6"/>
    <!-- bala que se derrite -->
    <g id="lb-bullet">
      <path d="M256 58
               C 298 92, 326 150, 328 214
               L 328 318
               C 328 340, 318 344, 314 360
               C 310 378, 312 396, 300 398
               C 288 400, 290 372, 280 364
               C 270 356, 262 372, 258 388
               C 254 404, 252 424, 238 424
               C 224 424, 228 398, 226 378
               C 224 360, 212 354, 204 366
               C 196 378, 198 392, 190 392
               C 180 392, 184 360, 184 340
               L 184 214
               C 186 150, 214 92, 256 58 Z" fill="url(#lb-chrome)"/>
      <path d="M256 58
               C 298 92, 326 150, 328 214
               L 328 318
               C 328 340, 318 344, 314 360
               C 310 378, 312 396, 300 398
               C 288 400, 290 372, 280 364
               C 270 356, 262 372, 258 388
               C 254 404, 252 424, 238 424
               C 224 424, 228 398, 226 378
               C 224 360, 212 354, 204 366
               C 196 378, 198 392, 190 392
               C 180 392, 184 360, 184 340
               L 184 214
               C 186 150, 214 92, 256 58 Z" fill="url(#lb-tint)"/>
      <!-- anillo de la vaina -->
      <path d="M184 226 C 220 238, 292 238, 328 226 L 328 246 C 292 258, 220 258, 184 246 Z" fill="#1a1233" opacity=".55"/>
      <path d="M184 230 C 220 242, 292 242, 328 230" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
      <!-- brillo -->
      <path d="M226 104 C 212 132, 206 168, 206 206" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    </g>
    <!-- gotas -->
    <path d="M300 414 C 306 426, 312 432, 312 440 A 12 12 0 0 1 288 440 C 288 432, 294 426, 300 414 Z" fill="url(#lb-drop)"/>
    <circle cx="190" cy="418" r="7" fill="url(#lb-drop)"/>
  </g>
</svg>
